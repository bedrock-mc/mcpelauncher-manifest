name: Release client

# Builds only mcpelauncher-client for macOS arm64 and Linux x86_64 (the UI, webview and frameworks come
# from upstream's packages). Pushing a client-v* tag attaches both archives to a release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'client-v*'

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake openssl@3 libpng libzip pkgconf
      - name: Build
        run: sh scripts/build-macos-client.sh
      - name: Package
        run: |
          BIN=build-macos/mcpelauncher-client/mcpelauncher-client
          test "$(lipo -archs "$BIN")" = arm64
          otool -L "$BIN" | grep -q '@rpath/libcrypto.dylib'
          if otool -L "$BIN" | grep -q '/opt/homebrew'; then echo "binary links Homebrew paths"; exit 1; fi
          mkdir -p dist && cp "$BIN" dist/mcpelauncher-client-arm64-v8a && cp scripts/README-release.md dist/README.md
          tar -C dist -czf mcpelauncher-client-macos-arm64.tar.gz mcpelauncher-client-arm64-v8a README.md
          shasum -a 256 mcpelauncher-client-macos-arm64.tar.gz > mcpelauncher-client-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: mcpelauncher-client-macos-arm64.tar.gz*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            clang cmake make git ca-certificates pkg-config xvfb \
            libssl-dev libpng-dev libzip-dev libx11-dev libxi-dev libudev-dev libevdev-dev \
            libegl1-mesa-dev libgles2-mesa-dev libasound2-dev libpulse-dev
      - name: Build
        run: sh scripts/build-linux-client.sh
      - name: Package
        run: |
          BIN=build-linux/mcpelauncher-client/mcpelauncher-client
          if ldd "$BIN" | grep -q 'not found'; then ldd "$BIN"; exit 1; fi
          xvfb-run -a "$BIN" --version | head -3
          mkdir -p dist && cp "$BIN" dist/mcpelauncher-client && cp scripts/README-release-linux.md dist/README.md
          tar -C dist -czf mcpelauncher-client-linux-x86_64.tar.gz mcpelauncher-client README.md
          sha256sum mcpelauncher-client-linux-x86_64.tar.gz > mcpelauncher-client-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: mcpelauncher-client-linux-x86_64.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mcpelauncher-client-macos-arm64.tar.gz
            mcpelauncher-client-macos-arm64.tar.gz.sha256
            mcpelauncher-client-linux-x86_64.tar.gz
            mcpelauncher-client-linux-x86_64.tar.gz.sha256
